name: CI — Validasi Data, Ukuran Model 3D & Build

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  validate-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repositori
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Pasang dependensi
        run: npm ci

      - name: Validasi skema data & anggaran ukuran model 3D
        run: npm run validate

      - name: Cek tipe & sintaks Astro
        run: npm run lint

      - name: Build produksi statis
        run: npm run build
